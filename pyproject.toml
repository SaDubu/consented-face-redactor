[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consented-face-redactor"
version = "0.1.0"
description = "Consented face redaction tool with mosaic and sticker rendering"
requires-python = ">=3.12"
license = {text = "UNLICENSED"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pydantic>=2.5",
]
inference = [
    "onnxruntime>=1.16",
    "numpy>=1.26",
]

[project.scripts]
consented-face-redactor = "consented_face_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
