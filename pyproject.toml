[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consented-face-redactor"
version = "0.1.0"
description = "Consented face redaction tool with mosaic and sticker rendering"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<10",
    "opencv-python-headless>=4.8,<6",
]
inference = [
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.8,<6",
]
tracking = [
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "einops>=0.8,<1",
]

[project.scripts]
consented-face-redactor = "consented_face_redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
